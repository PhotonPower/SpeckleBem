name: CI

on:
  push:
    branches: [main, "wp/**"]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc,   cc: gcc,   cxx: g++,     build_type: Release }
          - { os: ubuntu-24.04, compiler: clang, cc: clang, cxx: clang++, build_type: Debug }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libspdlog-dev is deliberately not installed: Ubuntu 24.04's spdlog links the system
          # fmt 9.1, whose headers trigger a GCC 13 -Warray-bounds false positive under -Werror;
          # cmake/Dependencies.cmake then fetches spdlog 1.15.3 with its bundled fmt (as in the
          # presets used for development). libomp-dev provides OpenMP for clang.
          sudo apt-get install -y ninja-build libeigen3-dev libopenblas-dev liblapack-dev \
              libomp-dev catch2 pybind11-dev python3-dev python3-numpy python3-pytest \
              python3-scipy

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DSPECKLEBEM_WARNINGS_AS_ERRORS=ON
          -DSPECKLEBEM_BUILD_PYTHON=ON
          -DSPECKLEBEM_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --parallel

      # ctest -L / -LE take regular expressions: -LE validation excludes both the `validation`
      # and the `validation-large` labels, -L '^validation$' selects only `validation`.
      # `ctest -L validation-large` (dense solves with 2N >= 15 k, minutes to hours, several GB)
      # and `ctest -L slow` (hidden accuracy and cost studies, minutes) are nightly / manual
      # only and never run in CI.
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -LE 'validation|slow'

      - name: Validation tests
        run: ctest --test-dir build --output-on-failure -L '^validation$'

      # SPECKLEBEM_NPY_FIXTURE makes the NumPy round trip of the .npy writer fail instead of
      # skip if the helper is missing, SPECKLEBEM_REQUIRE_SCIPY the SciPy test if SciPy is
      # missing; -rs lists the reasons of any skipped test.
      - name: Python tests
        env:
          SPECKLEBEM_NPY_FIXTURE: build/tests/specklebem_npy_fixture
          SPECKLEBEM_REQUIRE_SCIPY: "1"
        run: |
          PYTHONPATH=build/python:python python3 -m pytest tests/python -q -rs

  # Native Windows build with MSYS2 UCRT64 (GCC, libstdc++, OpenBLAS), as the win-release
  # preset. MSYS2's eigen3 package is Eigen 5 and deliberately not installed: Eigen 3.4.0 is
  # fetched (cmake/Dependencies.cmake), like spdlog, Catch2 and pybind11. The checkout is LF
  # despite the runner's core.autocrlf=true because of .gitattributes.
  windows-msys2:
    name: windows-2022 / msys2-ucrt64-gcc / Release
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            gcc:p cmake:p ninja:p openblas:p python:p python-numpy:p python-pytest:p python-scipy:p

      # The Python executables are pinned to MSYS2's python: CMake's FindPython also searches the
      # Windows registry and would otherwise pick the runner's preinstalled CPython.
      - name: Configure
        run: |
          py="$(cygpath -m "$(command -v python)")"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPECKLEBEM_WARNINGS_AS_ERRORS=ON \
            -DSPECKLEBEM_BUILD_PYTHON=ON \
            -DBLA_VENDOR=OpenBLAS \
            -DPython3_EXECUTABLE="$py" -DPYTHON_EXECUTABLE="$py"

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -LE 'validation|slow'

      - name: Validation tests
        run: ctest --test-dir build --output-on-failure -L '^validation$'

      # MSYS2's python.exe is a native Windows program: PYTHONPATH entries are separated by ';'.
      # The extension's DLLs (libstdc++, libgcc, libwinpthread) are found next to python.exe.
      - name: Python tests
        env:
          SPECKLEBEM_NPY_FIXTURE: build/tests/specklebem_npy_fixture.exe
          SPECKLEBEM_REQUIRE_SCIPY: "1"
        run: |
          PYTHONPATH='build/python;python' python -m pytest tests/python -q -rs

  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          pip install clang-format
          find include src tests examples python/src -name '*.hpp' -o -name '*.cpp' | xargs clang-format --dry-run --Werror
